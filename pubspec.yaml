name: my_pos
description: >-
  Kasseneck's Flutter plugin for Android Smart POS terminals: card payments,
  receipt printing and the RKSV signature card (SAM) for Austrian cash registers.
version: 0.3.2
homepage: https://kasseneck.at
documentation: https://pub.dev/documentation/my_pos/latest/
repository: https://github.com/mhmmdlkts/flutter_my_pos_plugin
issue_tracker: https://github.com/mhmmdlkts/flutter_my_pos_plugin/issues
topics:
  - kasseneck
  - rksv
  - registrierkasse
  - payment
  - receipt-printer

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kreiseck.my_pos
        pluginClass: MyPosPlugin
